const MOBILE_SCRIPT=`(function(){
'use strict';

const GROUPS={
  'KIR-2L-GRP':{name:'Kirisu Milk 2L',codes:['KIR3-2L','KIRB-2L']},
  'KIR-830-GRP':{name:'Kirisu Milk 830ml',codes:['KIR0-830','KIR3-830']},
  'KIR-135-GRP':{name:'Kirisu Yogurt',codes:['KIRP-Y135','KIRS-Y135','KIRV-Y135']},
  'CMP-220ml-GRP':{name:'Champei Milk 220ml',codes:['CH-O220','CHM-220','CHP-220','CHS-220','CHT-220']}
};

const ORDER=[
  {kind:'group',key:'KIR-2L-GRP'},
  {kind:'group',key:'KIR-830-GRP'},
  {kind:'single',code:'FF-2L',name:'Farm Fresh 2L'},
  {kind:'single',code:'AF-2L',name:'Aus Fresh 2L'},
  {kind:'single',code:'VP-2L',name:'VP Dalat Milk 2L'},
  {kind:'single',code:'OM-2L',name:"O'More 2L"},
  {kind:'single',code:'GF-190',name:'Greenfield Fullcream 1.90L'},
  {kind:'single',code:'GF-1L',name:'Greenfield Fullcream 1L'},
  {kind:'single',code:'GFJ-1L',name:'Greenfield Jersey 1L'},
  {kind:'group',key:'KIR-135-GRP'},
  {kind:'group',key:'CMP-220ml-GRP'}
];

const CODE_TO_GROUP={};
Object.entries(GROUPS).forEach(([key,g])=>g.codes.forEach(code=>CODE_TO_GROUP[code]=key));
const openGroups=new Set();

function cleanText(v){return String(v==null?'':v).trim()}
function qnum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function fmtQty(v){
  const n=qnum(v);
  return Number.isInteger(n)
    ? n.toLocaleString('en-US')
    : n.toLocaleString('en-US',{maximumFractionDigits:2});
}
function fmtWithUnit(v,unit){
  const u=cleanText(unit)||'unit';
  return fmtQty(v)+'/'+u;
}
function escText(v){
  return cleanText(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function sum(items,key){return items.reduce((t,x)=>t+qnum(x&&x[key]),0)}
function groupUnit(items){
  const units=[...new Set(items.map(x=>cleanText(x&&x.unit)).filter(Boolean))];
  return units.length===1?units[0]:'unit';
}
function rowHtml(cls,name,item,unit,extra=''){
  return '<tr class="'+cls+'" '+extra+'>'+
    '<td>'+name+'</td>'+
    '<td>'+escText(fmtWithUnit(item.assignedQty,unit))+'</td>'+
    '<td>'+escText(fmtWithUnit(item.soldQty,unit))+'</td>'+
    '<td>'+escText(fmtWithUnit(item.damagedQty,unit))+'</td>'+
    '<td>'+escText(fmtWithUnit(item.currentQty,unit))+'</td>'+
  '</tr>';
}
function ensureListHead(){
  const wrap=document.querySelector('.table-wrap');
  if(!wrap)return;
  let head=wrap.querySelector('.bb-stock-list-head');
  if(!head){
    head=document.createElement('div');
    head.className='bb-stock-list-head';
    head.innerHTML='<span>Name</span><span>Assign/Unit</span><span>Sold/Unit</span><span>Damage/Unit</span><span>Current/Unit</span>';
    const table=document.getElementById('itemTable');
    if(table)wrap.insertBefore(head,table);
  }
}
function staffMode(){
  const table=document.getElementById('itemTable');
  const privacy=document.getElementById('salesPrivacyNote');
  const adminBatch=document.body.classList.contains('bb-stock-admin-batch');
  return !!table
    &&!table.classList.contains('admin-table')
    &&(
      adminBatch
      ||
      (!!privacy&&!privacy.hidden)
    );
}
function renderMobileItems(){
  if(!staffMode())return false;
  if(typeof data==='undefined'||!data)return false;

  const body=document.getElementById('itemRows');
  const search=document.getElementById('searchBox');
  const count=document.getElementById('itemCount');
  if(!body)return false;

  ensureListHead();

  const all=Array.isArray(data.items)?data.items:[];
  const query=cleanText(search&&search.value).toLowerCase();
  const byCode=new Map(all.map(x=>[cleanText(x.productCode),x]));
  const used=new Set();
  let html='';
  let shown=0;

  ORDER.forEach(spec=>{
    if(spec.kind==='group'){
      const g=GROUPS[spec.key];
      const members=g.codes.map(code=>byCode.get(code)).filter(Boolean);
      if(!members.length)return;

      const matches=!query ||
        g.name.toLowerCase().includes(query) ||
        members.some(x=>
          cleanText(x.productName).toLowerCase().includes(query) ||
          cleanText(x.productCode).toLowerCase().includes(query)
        );
      if(!matches)return;

      members.forEach(x=>used.add(cleanText(x.productCode)));
      const unit=groupUnit(members);
      const total={
        assignedQty:sum(members,'assignedQty'),
        soldQty:sum(members,'soldQty'),
        damagedQty:sum(members,'damagedQty'),
        currentQty:sum(members,'currentQty')
      };

      const forcedOpen=!!query;
      const isOpen=forcedOpen||openGroups.has(spec.key);
      html+=rowHtml(
        'bb-group-row'+(isOpen?' bb-open':''),
        escText(g.name)+'<span class="bb-group-tag">GROUP</span>',
        total,
        unit,
        'data-bb-group="'+escText(spec.key)+'" role="button" tabindex="0" aria-expanded="'+(isOpen?'true':'false')+'"'
      );

      members.forEach(x=>{
        html+=rowHtml(
          'bb-child-row',
          escText(x.productName||x.productCode),
          x,
          x.unit,
          'data-bb-parent="'+escText(spec.key)+'"'+(isOpen?'':' hidden')
        );
      });
      shown++;
      return;
    }

    const x=byCode.get(spec.code);
    if(!x)return;
    const matches=!query ||
      spec.name.toLowerCase().includes(query) ||
      cleanText(x.productName).toLowerCase().includes(query) ||
      cleanText(x.productCode).toLowerCase().includes(query);
    if(!matches)return;

    used.add(spec.code);
    html+=rowHtml('bb-single-row',escText(spec.name),x,x.unit);
    shown++;
  });

  /* Keep any future/unmapped active stock visible after the requested order. */
  all.filter(x=>!used.has(cleanText(x.productCode))).forEach(x=>{
    const name=cleanText(x.productName||x.productCode);
    const code=cleanText(x.productCode);
    if(query && !name.toLowerCase().includes(query) && !code.toLowerCase().includes(query))return;
    html+=rowHtml('bb-single-row',escText(name),x,x.unit);
    shown++;
  });

  body.innerHTML=html||'<tr class="bb-empty-row"><td colspan="5" class="empty">No current stock matches this view.</td></tr>';
  if(count)count.textContent=shown+' line'+(shown===1?'':'s');
  return true;
}

function bindGroupEvents(){
  const body=document.getElementById('itemRows');
  if(!body||body.__bbGroupBound)return;
  body.__bbGroupBound=true;

  function toggle(row){
    const key=row&&row.dataset?row.dataset.bbGroup:'';
    if(!key)return;
    if(openGroups.has(key))openGroups.delete(key);else openGroups.add(key);
    renderMobileItems();
  }

  body.addEventListener('click',e=>toggle(e.target.closest('tr.bb-group-row')));
  body.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const row=e.target.closest('tr.bb-group-row');
    if(!row)return;
    e.preventDefault();
    toggle(row);
  });
}

function installRenderer(){
  if(typeof renderItems==='function'&&!renderItems.__bbMobileList){
    const desktopRender=renderItems;
    const wrapped=function(){
      if(staffMode()&&renderMobileItems())return;
      return desktopRender();
    };
    wrapped.__bbMobileList=true;
    renderItems=wrapped;

    const search=document.getElementById('searchBox');
    if(search)search.oninput=renderItems;
  }
  bindGroupEvents();
  if(staffMode())renderMobileItems();
}

function moveRefresh(){
  const profile=document.getElementById('profile');
  const actions=document.querySelector('.hero .actions');
  if(!profile||!actions||document.querySelector('.bb-stock-mobile-actions'))return;
  const holder=document.createElement('div');
  holder.className='bb-stock-mobile-actions';
  profile.insertAdjacentElement('afterend',holder);
  holder.appendChild(actions);
}
function syncMode(){
  const staff=staffMode();
  document.body.classList.toggle('bb-stock-mobile-staff',staff);
  if(staff){
    ensureListHead();
    installRenderer();
  }else{
    const head=document.querySelector('.bb-stock-list-head');
    if(head)head.remove();
  }
}
function observe(){
  const privacy=document.getElementById('salesPrivacyNote');
  if(privacy&&!privacy.__bbMobileObserved){
    privacy.__bbMobileObserved=true;
    new MutationObserver(()=>requestAnimationFrame(syncMode))
      .observe(privacy,{attributes:true,attributeFilter:['hidden']});
  }
  const table=document.getElementById('itemTable');
  if(table&&!table.__bbMobileObserved){
    table.__bbMobileObserved=true;
    new MutationObserver(()=>requestAnimationFrame(syncMode))
      .observe(table,{attributes:true,attributeFilter:['class']});
  }
}
function bootMobile(){
  moveRefresh();
  syncMode();
  observe();
  setTimeout(()=>{syncMode();installRenderer()},200);
  setTimeout(()=>{syncMode();installRenderer()},700);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',bootMobile,{once:true});
}else{
  bootMobile();
}
})();`;
function inject(){let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}if(!doc||!doc.head)return;let style=doc.getElementById('bb-mobile-stock-skin');if(!style){style=doc.createElement('style');style.id='bb-mobile-stock-skin';doc.head.appendChild(style)}style.textContent=MOBILE_CSS;if(!doc.getElementById('bb-mobile-stock-script')){const script=doc.createElement('script');script.id='bb-mobile-stock-script';script.textContent=MOBILE_SCRIPT;doc.body.appendChild(script)}boot.classList.add('hide')}
frame.addEventListener('load',()=>{setTimeout(inject,80);setTimeout(inject,450);setTimeout(inject,1100)});
})();
</script>

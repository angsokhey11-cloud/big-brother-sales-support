body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(6){grid-area:current!important;color:#102c51!important}

body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(2),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(3),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(4),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(5),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(6){min-height:48px!important;padding:6px!important;border:1px solid #e4eaf1!important;border-radius:8px!important;background:#f8fafc!important;font-size:11px!important;font-weight:900!important;overflow:hidden!important}

body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(2)::before,body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(3)::before,body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(4)::before,body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(5)::before,body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(6)::before{display:block;margin-bottom:3px;font-size:6.5px;line-height:1;color:#64758a;font-weight:700}

@media(max-width:380px){body{padding:6px 6px 18px!important}.summary{gap:5px!important}.kpi{min-height:62px!important;padding:7px 7px 6px 33px!important}.kpi::before{left:7px!important;top:7px!important;width:20px!important;height:20px!important}.kpi strong{font-size:13px!important}body.bb-stock-mobile-staff #itemRows>tr{gap:6px 5px!important;padding:8px 7px!important}body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(1)>strong{font-size:12px!important}body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(2),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(3),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(4),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(5),body.bb-stock-mobile-staff #itemRows>tr>td:nth-child(6){min-height:46px!important;padding:5px!important;font-size:10px!important}}

const MOBILE_SCRIPT=`(function(){
'use strict';
function markRows(){const body=document.getElementById('itemRows');if(!body)return;body.querySelectorAll(':scope > tr').forEach(tr=>tr.classList.toggle('bb-empty-row',!!tr.querySelector('td.empty')))}
function moveRefresh(){const profile=document.getElementById('profile');const actions=document.querySelector('.hero .actions');if(!profile||!actions||document.querySelector('.bb-stock-mobile-actions'))return;const holder=document.createElement('div');holder.className='bb-stock-mobile-actions';profile.insertAdjacentElement('afterend',holder);holder.appendChild(actions)}
function syncMode(){const table=document.getElementById('itemTable');const privacy=document.getElementById('salesPrivacyNote');const staff=!!table&&!table.classList.contains('admin-table')&&!!privacy&&!privacy.hidden;document.body.classList.toggle('bb-stock-mobile-staff',staff);markRows()}
function observe(){const rows=document.getElementById('itemRows');if(rows&&!rows.__bbMobileObserved){rows.__bbMobileObserved=true;new MutationObserver(()=>requestAnimationFrame(()=>{markRows();syncMode()})).observe(rows,{childList:true,subtree:true})}const privacy=document.getElementById('salesPrivacyNote');if(privacy&&!privacy.__bbMobileObserved){privacy.__bbMobileObserved=true;new MutationObserver(syncMode).observe(privacy,{attributes:true,attributeFilter:['hidden']})}const table=document.getElementById('itemTable');if(table&&!table.__bbMobileObserved){table.__bbMobileObserved=true;new MutationObserver(syncMode).observe(table,{attributes:true,attributeFilter:['class']})}}
function bootMobile(){moveRefresh();syncMode();observe();setTimeout(syncMode,250);setTimeout(syncMode,700)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootMobile,{once:true});else bootMobile();
})();`;
function inject(){let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}if(!doc||!doc.head)return;let style=doc.getElementById('bb-mobile-stock-skin');if(!style){style=doc.createElement('style');style.id='bb-mobile-stock-skin';doc.head.appendChild(style)}style.textContent=MOBILE_CSS;if(!doc.getElementById('bb-mobile-stock-script')){const script=doc.createElement('script');script.id='bb-mobile-stock-script';script.textContent=MOBILE_SCRIPT;doc.body.appendChild(script)}boot.classList.add('hide')}
frame.addEventListener('load',()=>{setTimeout(inject,80);setTimeout(inject,450);setTimeout(inject,1100)});
})();
</script>

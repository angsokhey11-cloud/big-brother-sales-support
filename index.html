          .calc-product-row{grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:'main delete' 'price total' 'qty qty'!important}
          .calc-line-total{text-align:right!important}
        }
      </style>`;

      const mobileScript=`<scr`+`ipt id="bb-mobile-calculator-script">(function(){
        'use strict';
        let manualExpanded=false,lastCount=0,selectedHistoryCustomerKey='';
        const HISTORY_KEY='bb_sales_support_calc_history_v1';
        const q=s=>document.querySelector(s);
        const clean=v=>String(v==null?'':v).trim();
        const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
        function selectedText(sel){if(!sel)return'';const o=sel.options&&sel.selectedIndex>=0?sel.options[sel.selectedIndex]:null;return clean(o?o.textContent:sel.value);}
        function currency(){const s=q('#calcCurrency');return s&&s.value==='KHR'?'KHR':'USD';}
        function historyEntries(){try{const x=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(x)?x:[];}catch(_){return[];}}
        function sameCustomer(entry){
          const name=clean(q('#calcCustomerSearch')?.value).toLowerCase();
          const location=clean(q('#calcLocation')?.value).toLowerCase();
          if(!name)return false;
          if(selectedHistoryCustomerKey&&clean(entry?.customerKey)===selectedHistoryCustomerKey)return true;
          return clean(entry?.customerName).toLowerCase()===name&&(!location||clean(entry?.locationCode).toLowerCase()===location);
        }
        function lastTransaction(){return historyEntries().find(sameCustomer)||null;}
        function money(value,curr){
          if(curr==='KHR')return Math.round(num(value)).toLocaleString('en-US')+' ៛';
          return String.fromCharCode(36)+num(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        }
        function transactionTotals(entry){
          const subtotal=(Array.isArray(entry?.lines)?entry.lines:[]).reduce((sum,line)=>sum+Math.max(0,num(line.qty))*Math.max(0,num(line.usdPrice)),0);
          return {subtotal,grand:Math.max(0,subtotal-Math.max(0,num(entry?.discountUSD)))};
        }
        function syncPreviewButton(){
          const b=q('#bbCalcPreviewLast');if(!b)return;
          b.hidden=!clean(q('#calcCustomerSearch')?.value);
        }
        function closeLastTransaction(){
          const modal=q('#bbCalcLastTxnModal');if(modal)modal.hidden=true;
        }
        function showLastTransaction(){
          const modal=q('#bbCalcLastTxnModal'),body=q('#bbCalcLastTxnBody'),title=q('#bbCalcLastTxnCustomer');
          if(!modal||!body||!title)return;
          const customer=clean(q('#calcCustomerSearch')?.value)||'Customer';
          title.textContent=customer;
          const entry=lastTransaction();
          body.textContent='';
          if(!entry){
            const empty=document.createElement('div');
            empty.className='bb-lasttxn-empty';
            empty.textContent='No previous transaction found for this customer on this device.';
            body.appendChild(empty);
            modal.hidden=false;
            return;
          }
          const curr=entry.currency==='KHR'?'KHR':'USD';
          const rate=Math.max(1,num(entry.rate)||4060);
          const totals=transactionTotals(entry);
          const meta=document.createElement('div');
          meta.className='bb-lasttxn-meta';
          const date=new Date(num(entry.createdAt));
          meta.textContent='Last calculation: '+(Number.isNaN(date.getTime())?'-':date.toLocaleString())+(clean(entry.locationCode)?' · '+clean(entry.locationCode):'');
          body.appendChild(meta);
          const products=document.createElement('div');
          products.className='bb-lasttxn-products';
          (Array.isArray(entry.lines)?entry.lines:[]).forEach(line=>{
            const row=document.createElement('div');row.className='bb-lasttxn-row';
            const info=document.createElement('div');
            const name=document.createElement('strong');name.textContent=clean(line.productName)||'Product';
            const detail=document.createElement('small');
            const unitPrice=curr==='KHR'?num(line.usdPrice)*rate:num(line.usdPrice);
            detail.textContent='QTY '+num(line.qty).toLocaleString('en-US')+' · '+money(unitPrice,curr)+' each';
            info.append(name,detail);
            const amount=document.createElement('div');amount.className='bb-lasttxn-amount';
            amount.textContent=money(num(line.qty)*unitPrice,curr);
            row.append(info,amount);
            products.appendChild(row);
          });
          body.appendChild(products);
          const total=document.createElement('div');total.className='bb-lasttxn-total';
          const label=document.createElement('small');label.textContent=num(entry.discountUSD)>0?'TOTAL AFTER DISCOUNT':'TOTAL';
          const strong=document.createElement('strong');strong.textContent=money(curr==='KHR'?totals.grand*rate:totals.grand,curr);
          total.append(label,strong);
          body.appendChild(total);
          modal.hidden=false;
        }
        function ensureUi(){
          const shell=q('#view-calculator .calc-shell'),card=q('#view-calculator .calc-control-card');if(!shell||!card)return false;
          let bar=q('#bbCalcCompactBar');
          if(!bar){bar=document.createElement('div');bar.id='bbCalcCompactBar';bar.innerHTML='<div class="bb-calc-summary-main"><strong class="bb-calc-summary-customer">Customer</strong><span class="bb-calc-summary-meta">—</span></div><button type="button" class="bb-calc-edit">✎ Edit</button>';shell.insertBefore(bar,card);bar.querySelector('.bb-calc-edit').addEventListener('click',()=>{manualExpanded=true;sync();});}
          let done=q('#bbCalcDone');
          if(!done){done=document.createElement('button');done.type='button';done.id='bbCalcDone';done.textContent='Done · Back to Products';card.appendChild(done);done.addEventListener('click',()=>{manualExpanded=false;sync();q('#calcProductSearch')?.focus();});}
          let preview=q('#bbCalcPreviewLast');
          if(!preview){
            preview=document.createElement('button');preview.type='button';preview.id='bbCalcPreviewLast';preview.textContent='Preview Last Transaction';preview.hidden=true;
            const summary=q('#calcCustomerSummary');if(summary)summary.insertAdjacentElement('afterend',preview);else card.appendChild(preview);
            preview.addEventListener('click',showLastTransaction);
          }
          let modal=q('#bbCalcLastTxnModal');
          if(!modal){
            modal=document.createElement('div');modal.id='bbCalcLastTxnModal';modal.hidden=true;
            modal.innerHTML='<div class="bb-lasttxn-sheet" role="dialog" aria-modal="true" aria-label="Last customer transaction"><div class="bb-lasttxn-head"><div><small>Previous Customer Calculation</small><strong id="bbCalcLastTxnCustomer">Customer</strong></div><button type="button" class="bb-lasttxn-close" aria-label="Close">×</button></div><div id="bbCalcLastTxnBody"></div></div>';
            document.body.appendChild(modal);
            modal.querySelector('.bb-lasttxn-close').addEventListener('click',closeLastTransaction);
            modal.addEventListener('click',event=>{if(event.target===modal)closeLastTransaction();});
          }
          syncPreviewButton();
          return true;
        }
        function updateBar(){
          const bar=q('#bbCalcCompactBar');if(!bar)return;
          const customer=clean(q('#calcCustomerSearch')?.value)||'Customer';
          const location=selectedText(q('#calcLocation'))||'Location';
          const rate=clean(q('#calcRate')?.value)||'—';
          bar.querySelector('.bb-calc-summary-customer').textContent=customer;
          bar.querySelector('.bb-calc-summary-meta').textContent=location+'  ·  '+currency()+'  ·  '+rate;
          syncPreviewButton();
        }
        function sync(){
          if(!ensureUi())return;
          const card=q('#view-calculator .calc-control-card'),bar=q('#bbCalcCompactBar'),lines=q('#calcLines');
          const count=lines?lines.querySelectorAll('.calc-product-row').length:0;
          if(count>0&&lastCount===0&&!manualExpanded)manualExpanded=false;
          if(count===0)manualExpanded=false;
          const collapsed=count>0&&!manualExpanded;
          card.style.display=collapsed?'none':'';
          card.classList.toggle('bb-mobile-editing',count>0&&manualExpanded);
          bar.classList.toggle('show',collapsed);
          updateBar();lastCount=count;
        }
        function observe(){
          const lines=q('#calcLines');if(lines&&!lines.__bbMobileCalcObserved){lines.__bbMobileCalcObserved=true;new MutationObserver(()=>requestAnimationFrame(sync)).observe(lines,{childList:true,subtree:true});}
          ['calcCustomerSearch','calcLocation','calcCurrency','calcRate'].forEach(id=>{const el=document.getElementById(id);if(el&&!el.__bbMobileCalcBound){el.__bbMobileCalcBound=true;el.addEventListener('input',()=>{if(id==='calcCustomerSearch')selectedHistoryCustomerKey='';updateBar();});el.addEventListener('change',updateBar);}});
          const suggestions=q('#calcCustomerSuggestions');
          if(suggestions&&!suggestions.__bbMobilePreviewBound){
            suggestions.__bbMobilePreviewBound=true;
            suggestions.addEventListener('click',event=>{
              const button=event.target.closest?.('.customer-suggestion');
              if(!button)return;
              selectedHistoryCustomerKey=clean(button.dataset.key);
              setTimeout(()=>{updateBar();syncPreviewButton();},0);
            });
          }
          ['calcCurrencyUSD','calcCurrencyKHR'].forEach(id=>{const el=document.getElementById(id);if(el&&!el.__bbMobileCalcBound){el.__bbMobileCalcBound=true;el.addEventListener('click',()=>setTimeout(updateBar,0));}});
          const newBtn=q('#calcNewBtn');
          if(newBtn&&!newBtn.__bbMobileNewBound){
            newBtn.__bbMobileNewBound=true;
            newBtn.addEventListener('click',()=>{
              setTimeout(()=>{
                const customer=q('#calcCustomerSearch');
                selectedHistoryCustomerKey='';
                if(customer){
                  customer.value='';
                  customer.dispatchEvent(new Event('input',{bubbles:true}));
                }
                const summary=q('#calcCustomerSummary');
                if(summary)summary.innerHTML='';
                const rate=q('#calcRate');
                if(rate)rate.dispatchEvent(new Event('input',{bubbles:true}));
                updateBar();
                customer?.focus();
              },0);
            });
          }
        }
        function boot(){if(!ensureUi()){setTimeout(boot,80);return;}observe();sync();setTimeout(sync,250);setTimeout(sync,800);}
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
      })();</scr`+`ipt>`;

      const mobileReportStyle='<style id="bb-mobile-calculator-report-style">'+"\n#view-calculator .calc-history-head,\n#view-calculator #calcHistoryPanel{display:none!important}\n#bbCalcReport{display:grid;gap:9px}\n.bb-report-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n.bb-report-title h2{margin:0;color:#173f77;font-size:15px}\n.bb-report-title small{display:block;margin-top:3px;color:#71869c;font-size:8.5px;line-height:1.35}\n.bb-report-filter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}\n.bb-report-filter select,.bb-report-filter input{width:100%;min-height:38px;border:1px solid #cbd9e8;border-radius:9px;background:#fff;color:#243b58;padding:6px 8px;font-size:11px;font-weight:800}\n#bbCalcReportDate[hidden]{display:none!important}\n.bb-report-section{border:1px solid #dfe8f1;border-radius:11px;background:#fff;overflow:hidden}\n.bb-report-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#f7fafd;border-bottom:1px solid #e5ecf3}\n.bb-report-section-head strong{color:#173f77;font-size:11px}\n.bb-report-section-head small{color:#71869c;font-size:8px;font-weight:800}\n.bb-report-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;background:#f7fafd;border-bottom:1px solid #e5ecf3}\n.bb-report-select-all{display:flex;align-items:center;gap:6px;color:#526a82;font-size:9px;font-weight:900}\n.bb-report-select-all input{width:16px;height:16px}\n#bbCalcDeleteSelected{min-height:34px;border:0;border-radius:8px;padding:6px 10px;background:#ffe8e6;color:#c43a32;font-size:9px;font-weight:900}\n#bbCalcDeleteSelected:disabled{opacity:.45}\n.bb-report-candidates{display:grid;gap:7px;padding:8px}\n.bb-report-candidate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid #dfe7f0;border-radius:10px;padding:8px;background:#fff}\n.bb-report-candidate input{width:17px;height:17px}\n.bb-report-candidate-main strong{display:block;color:#173f77;font-size:11px}\n.bb-report-candidate-main small{display:block;margin-top:2px;color:#71869c;font-size:8px;line-height:1.35}\n.bb-report-candidate-amount{color:#173f77;font-size:11px;font-weight:900;text-align:right;white-space:nowrap}\n.bb-report-empty{padding:18px 10px;text-align:center;color:#71869c;font-size:10px;font-weight:800}\n\n.bb-selected-report{display:grid;gap:9px}\n.bb-selected-kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}\n.bb-selected-kpi{border:1px solid #dce6f0;border-radius:10px;background:#f8fbfe;padding:9px}\n.bb-selected-kpi small{display:block;color:#71869c;font-size:8px;font-weight:900;text-transform:uppercase}\n.bb-selected-kpi strong{display:block;margin-top:4px;color:#173f77;font-size:17px;line-height:1}\n.bb-selected-table{display:grid}\n.bb-selected-head,.bb-selected-row{display:grid;grid-template-columns:minmax(0,1.4fr) .62fr .8fr;gap:7px;align-items:center}\n.bb-selected-head{padding:7px 9px;background:#edf4fb;color:#60758c;font-size:8px;font-weight:900;text-transform:uppercase}\n.bb-selected-row{padding:9px;border-bottom:1px solid #eef2f6}\n.bb-selected-row:last-child{border-bottom:0}\n.bb-selected-customer strong{display:block;color:#173f77;font-size:10px;line-height:1.25}\n.bb-selected-customer small{display:block;margin-top:2px;color:#7b8da0;font-size:7.5px}\n.bb-selected-qty{color:#243b58;font-size:11px;font-weight:900;text-align:center}\n.bb-selected-amount{color:#173f77;font-size:10px;font-weight:900;text-align:right;white-space:nowrap}\n\n.bb-product-summary{border-top:1px solid #e4ebf2}\n.bb-product-summary-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;background:#f4f8fc;color:#60758c;font-size:8px;font-weight:900;text-transform:uppercase}\n.bb-product-summary-list{display:grid}\n.bb-product-summary-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid #eef2f6}\n.bb-product-summary-row:first-child{border-top:0}\n.bb-product-summary-row span{color:#334d69;font-size:10px;font-weight:800}\n.bb-product-summary-row strong{color:#173f77;font-size:12px;white-space:nowrap}\n.bb-product-summary-grand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;background:#eaf3ff;border-top:1px solid #cfe0f3}\n.bb-product-summary-grand span{color:#174d90;font-size:9px;font-weight:900}\n.bb-product-summary-grand strong{color:#173f77;font-size:14px}\n\n.bb-selected-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 11px;background:#173f77;color:#fff}\n.bb-selected-summary small{display:block;font-size:8px;font-weight:800;opacity:.78}\n.bb-selected-summary strong{display:block;margin-top:2px;font-size:16px}\n.bb-selected-summary-amount{text-align:right}\n@media(max-width:380px){\n  .bb-report-filter{grid-template-columns:1fr}\n  .bb-selected-head,.bb-selected-row{grid-template-columns:minmax(0,1.25fr) .55fr .8fr}\n}\n"+'</style>';

      const mobileReportScript='<scr'+'ipt id="bb-mobile-calculator-report-script">'+"\n(function(){\n  'use strict';\n  const HISTORY_KEY='bb_sales_support_calc_history_v1';\n  const selected=new Set();\n  let mode='today';\n  let specificDate='';\n\n  const q=s=>document.querySelector(s);\n  const clean=v=>String(v==null?'':v).trim();\n  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};\n  const esc=v=>clean(v).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}[ch]));\n\n  function historyEntries(){\n    try{\n      const parsed=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');\n      return Array.isArray(parsed)?parsed:[];\n    }catch(_){\n      return [];\n    }\n  }\n\n  function dateKey(value){\n    const d=new Date(num(value));\n    if(Number.isNaN(d.getTime()))return'';\n    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n  }\n\n  function todayKey(){return dateKey(Date.now());}\n\n  function filteredEntries(){\n    const all=historyEntries();\n    if(mode==='all')return all;\n    const target=mode==='date'?specificDate:todayKey();\n    return all.filter(entry=>dateKey(entry?.createdAt)===target);\n  }\n\n  function selectedEntries(){\n    const map=new Map(historyEntries().map(entry=>[clean(entry.id),entry]));\n    return Array.from(selected).map(id=>map.get(id)).filter(Boolean);\n  }\n\n  function entryGrandUSD(entry){\n    const subtotal=(Array.isArray(entry?.lines)?entry.lines:[]).reduce(\n      (sum,line)=>sum+Math.max(0,num(line.qty))*Math.max(0,num(line.usdPrice)),0\n    );\n    return Math.max(0,subtotal-Math.max(0,num(entry?.discountUSD)));\n  }\n\n  function entryQty(entry){\n    return (Array.isArray(entry?.lines)?entry.lines:[]).reduce(\n      (sum,line)=>sum+Math.max(0,num(line.qty)),0\n    );\n  }\n\n  function productQtySummary(entries){\n    const map=new Map();\n\n    entries.forEach(entry=>{\n      (Array.isArray(entry?.lines)?entry.lines:[]).forEach(line=>{\n        const code=clean(line.productCode);\n        const name=clean(line.productName)||code||'Product';\n        const key=(code||name).toLowerCase();\n        if(!key)return;\n\n        const current=map.get(key)||{\n          productCode:code,\n          productName:name,\n          qty:0\n        };\n\n        current.qty+=Math.max(0,num(line.qty));\n        map.set(key,current);\n      });\n    });\n\n    return Array.from(map.values()).sort(\n      (a,b)=>b.qty-a.qty||a.productName.localeCompare(b.productName)\n    );\n  }\n\n  function moneyUSD(value){\n    return String.fromCharCode(36)+num(value).toLocaleString('en-US',{\n      minimumFractionDigits:2,\n      maximumFractionDigits:2\n    });\n  }\n\n  function entryMoney(entry,valueUSD){\n    const curr=entry?.currency==='KHR'?'KHR':'USD';\n    const rate=Math.max(1,num(entry?.rate)||4060);\n    if(curr==='KHR'){\n      return Math.round(num(valueUSD)*rate).toLocaleString('en-US')+' ៛';\n    }\n    return moneyUSD(valueUSD);\n  }\n\n  function entryCustomerKey(entry){\n    return clean(entry?.customerKey) ||\n      (clean(entry?.locationCode).toLowerCase()+'|'+clean(entry?.customerName).toLowerCase());\n  }\n\n  function formatDateTime(value){\n    const d=new Date(num(value));\n    if(Number.isNaN(d.getTime()))return'-';\n    return d.toLocaleString(undefined,{\n      month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'\n    });\n  }\n\n  function ensureUi(){\n    const card=q('#view-calculator .calc-history-card');\n    if(!card)return false;\n\n    let root=q('#bbCalcReport');\n    if(!root){\n      root=document.createElement('div');\n      root.id='bbCalcReport';\n      root.innerHTML=\n        '<div class=\"bb-report-title\">'+\n          '<div><h2>📊 Calculator Report</h2>'+\n          '<small>Filter history, select transactions, then the report below summarizes only those selected transactions.</small></div>'+\n        '</div>'+\n        '<div class=\"bb-report-filter\">'+\n          '<select id=\"bbCalcReportFilter\" aria-label=\"Calculator report filter\">'+\n            '<option value=\"today\">Today Calculations</option>'+\n            '<option value=\"date\">Specific Date</option>'+\n            '<option value=\"all\">All History</option>'+\n          '</select>'+\n          '<input id=\"bbCalcReportDate\" type=\"date\" aria-label=\"Specific report date\" hidden>'+\n        '</div>'+\n        '<div class=\"bb-report-section\">'+\n          '<div class=\"bb-report-section-head\"><strong>Select Transactions</strong><small id=\"bbReportRangeLabel\">Today</small></div>'+\n          '<div class=\"bb-report-actions\">'+\n            '<label class=\"bb-report-select-all\"><input type=\"checkbox\" id=\"bbReportSelectAll\"> Select all shown</label>'+\n            '<button type=\"button\" id=\"bbCalcDeleteSelected\" disabled>Delete Selected</button>'+\n          '</div>'+\n          '<div id=\"bbReportCandidates\" class=\"bb-report-candidates\"></div>'+\n        '</div>'+\n        '<div class=\"bb-selected-report\">'+\n          '<div class=\"bb-report-section\">'+\n            '<div class=\"bb-report-section-head\"><strong>Selected Transaction Report</strong><small id=\"bbSelectedCountLabel\">0 selected</small></div>'+\n            '<div class=\"bb-selected-kpis\">'+\n              '<div class=\"bb-selected-kpi\"><small>Transactions</small><strong id=\"bbSelectedTransactions\">0</strong></div>'+\n              '<div class=\"bb-selected-kpi\"><small>Customers</small><strong id=\"bbSelectedCustomers\">0</strong></div>'+\n            '</div>'+\n            '<div class=\"bb-selected-table\">'+\n              '<div class=\"bb-selected-head\"><span>Customer Name</span><span style=\"text-align:center\">QTY Sold</span><span style=\"text-align:right\">Amount</span></div>'+\n              '<div id=\"bbSelectedRows\"></div>'+\n            '</div>'+\n            '<div class=\"bb-product-summary\">'+\n              '<div class=\"bb-product-summary-head\"><span>Product QTY Summary</span><span>QTY</span></div>'+\n              '<div id=\"bbSelectedProductSummary\" class=\"bb-product-summary-list\"></div>'+\n              '<div class=\"bb-product-summary-grand\"><span>GRAND TOTAL QTY</span><strong id=\"bbSelectedSummaryQty\">0</strong></div>'+\n            '</div>'+\n            '<div class=\"bb-selected-summary\">'+\n              '<div><small>SELECTED TRANSACTIONS</small><strong id=\"bbSelectedSummaryTransactions\">0</strong></div>'+\n              '<div class=\"bb-selected-summary-amount\"><small>TOTAL AMOUNT USD</small><strong id=\"bbSelectedSummaryAmount\">$0.00</strong></div>'+\n            '</div>'+\n          '</div>'+\n        '</div>';\n\n      card.appendChild(root);\n\n      const filter=q('#bbCalcReportFilter');\n      const date=q('#bbCalcReportDate');\n      specificDate=todayKey();\n      date.value=specificDate;\n\n      filter.addEventListener('change',()=>{\n        mode=filter.value;\n        selected.clear();\n        date.hidden=mode!=='date';\n        if(mode==='date'&&!date.value)date.value=todayKey();\n        specificDate=date.value||todayKey();\n        render();\n      });\n\n      date.addEventListener('change',()=>{\n        specificDate=date.value||todayKey();\n        selected.clear();\n        render();\n      });\n\n      q('#bbReportSelectAll').addEventListener('change',event=>{\n        const entries=filteredEntries();\n        if(event.target.checked){\n          entries.forEach(entry=>selected.add(clean(entry.id)));\n        }else{\n          entries.forEach(entry=>selected.delete(clean(entry.id)));\n        }\n        render();\n      });\n\n      q('#bbCalcDeleteSelected').addEventListener('click',()=>{\n        const ids=Array.from(selected).filter(Boolean);\n        if(!ids.length)return;\n\n        const ok=window.confirm(\n          'Delete '+ids.length+' selected calculation'+(ids.length===1?'':'s')+\n          '? This cannot be undone.'\n        );\n        if(!ok)return;\n\n        let deleted=0;\n        ids.forEach(id=>{\n          const button=Array.from(document.querySelectorAll('[data-calc-history-delete]'))\n            .find(el=>clean(el.dataset.calcHistoryDelete)===id);\n          if(button){\n            button.click();\n            deleted++;\n          }\n        });\n\n        selected.clear();\n\n        if(deleted<ids.length){\n          window.alert('Some history entries were still loading. Please try again.');\n        }\n\n        setTimeout(render,0);\n      });\n    }\n\n    const legacyList=q('#calcHistoryList');\n    if(legacyList&&!legacyList.__bbReportObserved){\n      legacyList.__bbReportObserved=true;\n      new MutationObserver(()=>setTimeout(render,0))\n        .observe(legacyList,{childList:true,subtree:true});\n    }\n\n    return true;\n  }\n\n  function renderCandidates(entries){\n    const box=q('#bbReportCandidates');\n\n    if(!entries.length){\n      box.innerHTML='<div class=\"bb-report-empty\">No calculator transactions for this filter.</div>';\n      return;\n    }\n\n    box.innerHTML=entries.map(entry=>{\n      const id=clean(entry.id);\n      const qty=entryQty(entry);\n      const checked=selected.has(id)?' checked':'';\n      return '<label class=\"bb-report-candidate\">'+\n        '<input type=\"checkbox\" data-bb-report-id=\"'+esc(id)+'\"'+checked+'>'+\n        '<span class=\"bb-report-candidate-main\">'+\n          '<strong>'+esc(entry.customerName||'Customer')+'</strong>'+\n          '<small>'+esc(formatDateTime(entry.createdAt))+\n            (entry.locationCode?' · '+esc(entry.locationCode):'')+\n            ' · '+num(qty).toLocaleString('en-US')+' QTY</small>'+\n        '</span>'+\n        '<span class=\"bb-report-candidate-amount\">'+esc(entryMoney(entry,entryGrandUSD(entry)))+'</span>'+\n      '</label>';\n    }).join('');\n\n    box.querySelectorAll('[data-bb-report-id]').forEach(input=>{\n      input.addEventListener('change',()=>{\n        const id=clean(input.dataset.bbReportId);\n        if(input.checked)selected.add(id);\n        else selected.delete(id);\n        render();\n      });\n    });\n  }\n\n  function renderSelectedReport(){\n    const entries=selectedEntries();\n    const customers=new Set(entries.map(entryCustomerKey).filter(Boolean));\n    const totalQty=entries.reduce((sum,entry)=>sum+entryQty(entry),0);\n    const totalSales=entries.reduce((sum,entry)=>sum+entryGrandUSD(entry),0);\n    const productSummary=productQtySummary(entries);\n\n    q('#bbSelectedTransactions').textContent=String(entries.length);\n    q('#bbSelectedCustomers').textContent=String(customers.size);\n    q('#bbSelectedSummaryQty').textContent=num(totalQty).toLocaleString('en-US');\n    q('#bbSelectedSummaryAmount').textContent=moneyUSD(totalSales);\n    q('#bbSelectedSummaryTransactions').textContent=String(entries.length);\n    q('#bbSelectedCountLabel').textContent=\n      entries.length+' selected transaction'+(entries.length===1?'':'s');\n\n    const rows=q('#bbSelectedRows');\n\n    if(!entries.length){\n      rows.innerHTML='<div class=\"bb-report-empty\">Select transactions above to include them in this report.</div>';\n    }else{\n      rows.innerHTML=entries.map(entry=>{\n        const qty=entryQty(entry);\n        return '<div class=\"bb-selected-row\">'+\n          '<div class=\"bb-selected-customer\">'+\n            '<strong>'+esc(entry.customerName||'Customer')+'</strong>'+\n            '<small>'+esc(formatDateTime(entry.createdAt))+\n              (entry.locationCode?' · '+esc(entry.locationCode):'')+'</small>'+\n          '</div>'+\n          '<div class=\"bb-selected-qty\">'+num(qty).toLocaleString('en-US')+'</div>'+\n          '<div class=\"bb-selected-amount\">'+esc(entryMoney(entry,entryGrandUSD(entry)))+'</div>'+\n        '</div>';\n      }).join('');\n    }\n\n    const productBox=q('#bbSelectedProductSummary');\n\n    if(!productSummary.length){\n      productBox.innerHTML='<div class=\"bb-report-empty\">Select transactions to see product quantity totals.</div>';\n    }else{\n      productBox.innerHTML=productSummary.map(item=>\n        '<div class=\"bb-product-summary-row\">'+\n          '<span>'+esc(item.productName)+(item.productCode?' · '+esc(item.productCode):'')+'</span>'+\n          '<strong>'+num(item.qty).toLocaleString('en-US')+'</strong>'+\n        '</div>'\n      ).join('');\n    }\n  }\n\n  function renderSelectionState(entries){\n    const visibleIds=entries.map(entry=>clean(entry.id)).filter(Boolean);\n    const visibleSelected=visibleIds.filter(id=>selected.has(id)).length;\n\n    const selectAll=q('#bbReportSelectAll');\n    selectAll.checked=visibleIds.length>0&&visibleSelected===visibleIds.length;\n    selectAll.indeterminate=visibleSelected>0&&visibleSelected<visibleIds.length;\n\n    const del=q('#bbCalcDeleteSelected');\n    del.disabled=selected.size===0;\n    del.textContent=selected.size\n      ? 'Delete Selected ('+selected.size+')'\n      : 'Delete Selected';\n  }\n\n  function render(){\n    if(!ensureUi())return;\n\n    const allIds=new Set(historyEntries().map(entry=>clean(entry.id)));\n    Array.from(selected).forEach(id=>{if(!allIds.has(id))selected.delete(id);});\n\n    const entries=filteredEntries();\n\n    if(mode==='today'){\n      q('#bbReportRangeLabel').textContent='Today';\n    }else if(mode==='date'){\n      q('#bbReportRangeLabel').textContent=q('#bbCalcReportDate').value||specificDate||'Specific Date';\n    }else{\n      q('#bbReportRangeLabel').textContent='All History';\n    }\n\n    renderCandidates(entries);\n    renderSelectionState(entries);\n    renderSelectedReport();\n  }\n\n  function boot(){\n    if(!ensureUi()){\n      setTimeout(boot,80);\n      return;\n    }\n    render();\n    setTimeout(render,250);\n    setTimeout(render,900);\n  }\n\n  window.addEventListener('storage',event=>{\n    if(event.key===HISTORY_KEY)render();\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',boot,{once:true});\n  }else{\n    boot();\n  }\n})();\n"+'</scr'+'ipt>';

      const hc=html.toLowerCase().indexOf('</head>');

    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Sales Support<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
